<!DOCTYPE html>
<html lang="vi">

<head>
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
  <title>Tin tức</title>
  <meta name="keywords" content="Tin tức">
  <meta name="description" content="Trang Tin tức cập nhật mới nhất">
  <link rel="icon" type="image/x-icon" href="https://we1.io.vn/favicon.ico">
  <link href="https://fonts.googleapis.com/css?family=Poppins:300,400,500,600,700" rel="stylesheet" type="text/css">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" rel="stylesheet" type="text/css">
  <link href="../assets/vendor/bootstrap/css/bootstrap.min.css" rel="stylesheet" type="text/css">
  <link href="../assets/css/fe-header.css" rel="stylesheet" type="text/css">
  <link href="../assets/css/fe-news.css" rel="stylesheet" type="text/css">
  <style>
    /* Loại bỏ giao diện box, hòa vào trang */
    .fe-news-page {
      background: transparent !important;
      padding: 24px 0 60px;
    }
    .fe-news-featured {
      background: transparent !important;
      box-shadow: none !important;
      border-radius: 0 !important;
      margin-bottom: 32px;
    }
    .fe-news-featured-content {
      padding: 20px 0 !important;
    }
    .fe-news-item {
      background: transparent !important;
      box-shadow: none !important;
      border-radius: 0 !important;
      padding: 16px 0 !important;
      border-bottom: 1px solid #e2e8f0;
    }
    .fe-news-item:last-child {
      border-bottom: none;
    }
    .fe-news-detail-card {
      background: transparent !important;
      box-shadow: none !important;
      border-radius: 0 !important;
      padding: 20px 0 !important;
    }
    .fe-news-sidebar-card {
      background: transparent !important;
      box-shadow: none !important;
      border: none !important;
      border-radius: 0 !important;
    }
    .fe-news-sidebar-header {
      background: transparent !important;
      border-bottom: 2px solid #0f2742 !important;
      padding: 10px 0 !important;
      font-size: 16px !important;
    }
    .fe-news-sidebar-item {
      padding: 14px 0 !important;
      border-bottom: 1px solid #edf2f7 !important;
    }
    .fe-news-sidebar-item:hover {
      background: transparent !important;
    }
  </style>
</head>

<body data-page="news">
  <header class="fe-header w-100" data-page-region="header" data-render-state="loading"></header>
  <main>
    <div class="fe-news-page">
      <div class="container">
        <div class="fe-news-breadcrumb">
          <a href="/">Home</a> > <span>TIN TỨC</span>
        </div>
        <div class="row" id="news-grid-row">
          <!-- Cột trái: Bài chính, danh sách bài viết HOẶC chi tiết bài viết (Hòa vào trang) -->
          <div class="col-lg-8" id="main-news-container">
            <!-- Sẽ được render bằng JavaScript -->
          </div>
          
          <!-- Cột phải: Sidebar luôn hiển thị -->
          <div class="col-lg-4">
            <div class="fe-news-sidebar-card">
              <div class="fe-news-sidebar-header">Bài viết nổi bật</div>
              <div class="fe-news-sidebar-list" id="sidebar-news-container">
                <!-- Sẽ được render ngẫu nhiên bằng JavaScript -->
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </main>
  <footer class="fe-footer" data-page-region="footer" data-render-state="loading"></footer>
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script src="../assets/vendor/bootstrap/js/bootstrap.bundle.min.js"></script>
  <script src="../assets/js/config.js"></script>
  <script src="../assets/js/fe-page-renderer.js"></script>
  <script>
    $(document).ready(function () {
      function setMainPadding() {
        var headerH = $('.fe-header').outerHeight() || 0;
        document.documentElement.style.setProperty('--fe-header-height', headerH + 'px');
        if (window.matchMedia('(max-width: 768px)').matches) {
          $('main').css('padding-top', headerH + 'px');
        } else {
          $('main').css('padding-top', '');
        }
      }

      function initHeaderInteractions() {
        setMainPadding();
      }

      initHeaderInteractions();
      $(window).on('resize load', setMainPadding);
      window.addEventListener('fe:page-rendered', initHeaderInteractions);

      // --- API DATA ---
      const ITEMS_PER_PAGE = 4;
      let currentPage = 1;
      let totalPages = 1;
      
      function getApiUrl() {
        return (window.ENV && window.ENV.BASE_URL ? window.ENV.BASE_URL : "https://api.capi.id.vn") + "/web/statics";
      }

      function formatDate(timestamp) {
        if (!timestamp) return '';
        const date = new Date(timestamp * 1000);
        const day = String(date.getDate()).padStart(2, '0');
        const month = String(date.getMonth() + 1).padStart(2, '0');
        const year = date.getFullYear();
        return `${day}/${month}/${year}`;
      }

      function fetchMainNews(page) {
        $.ajax({
          url: getApiUrl(),
          method: 'GET',
          data: { page: page, limit: ITEMS_PER_PAGE },
          success: function(res) {
            if (res && res.success) {
              const rawData = res.data || {};
              const data = Array.isArray(rawData) ? rawData : (rawData.data || []);
              const paging = res.paging || rawData.paging || {};
              totalPages = paging.total_page || Math.ceil((paging.total || 0) / ITEMS_PER_PAGE) || 1;
              renderMainNews(data, page);
            }
          },
          error: function(err) {
            console.error("Lỗi khi tải danh sách tin tức", err);
          }
        });
      }

      function renderMainNews(pageItems, page) {
        let html = '';
        if (pageItems.length > 0) {
          const featured = pageItems[0];
          const featuredUrl = '?id=' + featured.statics_id;
          html += `
            <div class="fe-news-featured">
              <a href="${featuredUrl}"><img class="fe-news-featured-img" src="${featured.statics_image}" alt="${featured.statics_title}"></a>
              <div class="fe-news-featured-content">
                <a href="${featuredUrl}" style="text-decoration:none;"><h2 class="fe-news-featured-title">${featured.statics_title}</h2></a>
                <p class="fe-news-featured-intro">${featured.statics_intro || ''}</p>
              </div>
            </div>
          `;
          
          if (pageItems.length > 1) {
            html += '<div class="fe-news-list">';
            for (let i = 1; i < pageItems.length; i++) {
              const item = pageItems[i];
              const itemUrl = '?id=' + item.statics_id;
              html += `
                <div class="fe-news-item">
                  <a href="${itemUrl}" class="fe-news-item-img-wrap">
                    <img class="fe-news-item-img" src="${item.statics_image}" alt="${item.statics_title}">
                  </a>
                  <div class="fe-news-item-content">
                    <a href="${itemUrl}" class="fe-news-item-title">${item.statics_title}</a>
                    <p class="fe-news-item-intro">${item.statics_intro || ''}</p>
                  </div>
                </div>
              `;
            }
            html += '</div>';
          }
        } else {
          html = '<p>Không có bài viết nào.</p>';
        }

        if (totalPages > 1) {
          html += '<div class="fe-news-pagination-wrap"><ul class="fe-news-pagination">';
          html += `
            <li class="page-item ${page === 1 ? 'disabled' : ''}">
              <a class="page-link" href="#" data-page="${page - 1}"><i class="fa-solid fa-angle-left"></i></a>
            </li>
          `;
          for (let i = 1; i <= totalPages; i++) {
            html += `
              <li class="page-item ${page === i ? 'active' : ''}">
                <a class="page-link" href="#" data-page="${i}">${i}</a>
              </li>
            `;
          }
          html += `
            <li class="page-item ${page === totalPages ? 'disabled' : ''}">
              <a class="page-link" href="#" data-page="${page + 1}"><i class="fa-solid fa-angle-right"></i></a>
            </li>
          `;
          html += '</ul></div>';
        }

        $('#main-news-container').html(html);
        
        $('.fe-news-pagination .page-link').off('click').on('click', function(e) {
          e.preventDefault();
          const targetPage = parseInt($(this).attr('data-page'));
          if (targetPage >= 1 && targetPage <= totalPages && targetPage !== currentPage) {
            currentPage = targetPage;
            fetchMainNews(currentPage);
            $('html, body').animate({ scrollTop: 0 }, 300);
          }
        });
      }

      function fetchSidebarNews() {
        $.ajax({
          url: getApiUrl(),
          method: 'GET',
          data: { page: 1, limit: 30 },
          success: function(res) {
            if (res && res.success) {
              const rawData = res.data || {};
              const data = Array.isArray(rawData) ? rawData : (rawData.data || []);
              renderSidebar(data);
            }
          },
          error: function(err) {
            console.error("Lỗi khi tải sidebar", err);
          }
        });
      }

      function renderSidebar(items) {
        if (!items || items.length === 0) return;
        const shuffled = [...items].sort(() => 0.5 - Math.random());
        const sidebarItems = shuffled.slice(0, 10);
        
        let html = '';
        sidebarItems.forEach(item => {
          const itemUrl = '?id=' + item.statics_id;
          html += `
            <a href="${itemUrl}" class="fe-news-sidebar-item">
              <h3 class="fe-news-sidebar-title">${item.statics_title}</h3>
              <img class="fe-news-sidebar-img" src="${item.statics_image}" alt="${item.statics_title}">
            </a>
          `;
        });
        
        $('#sidebar-news-container').html(html);
      }

      function showDetail(id) {
        $('#main-news-container').html('<div class="fe-news-detail-card"><p>Đang tải chi tiết bài viết...</p></div>');
        
        // Update breadcrumb
        $('.fe-news-breadcrumb').html('<a href="/">Home</a> > <a href="#" class="fe-news-back-btn">TIN TỨC</a> > <span>Chi tiết</span>');

        $.ajax({
          url: getApiUrl() + "/" + id,
          method: 'GET',
          success: function(res) {
            if (res && res.success && res.data) {
              renderDetail(res.data);
            } else {
              $('#main-news-container').html('<div class="fe-news-detail-card"><p>Không tìm thấy bài viết hoặc bài viết đã bị xóa.</p><a href="#" class="fe-news-back-btn btn btn-secondary mt-3">Quay lại danh sách</a></div>');
            }
          },
          error: function(err) {
            console.error("Lỗi khi tải chi tiết bài viết", err);
            $('#main-news-container').html('<div class="fe-news-detail-card"><p>Có lỗi xảy ra khi tải bài viết. Vui lòng thử lại sau.</p><a href="#" class="fe-news-back-btn btn btn-secondary mt-3">Quay lại danh sách</a></div>');
          }
        });
      }

      function renderDetail(item) {
        const formattedDate = formatDate(item.statics_created);
        const html = `
          <div class="fe-news-detail-card">
            <h1 class="fe-news-detail-title">${item.statics_title}</h1>
            <div class="fe-news-detail-meta">
              <span><i class="fa-regular fa-calendar"></i> ${formattedDate}</span>
            </div>
            ${item.statics_intro ? `<div class="fe-news-detail-intro">${item.statics_intro}</div>` : ''}
            <div class="fe-news-detail-body">
              ${item.statics_content || ''}
            </div>
            <div class="fe-news-detail-actions">
              <a href="#" class="fe-news-back-btn"><i class="fa-solid fa-arrow-left"></i> Quay lại danh sách</a>
            </div>
          </div>
        `;
        $('#main-news-container').html(html);
        $('html, body').animate({ scrollTop: 0 }, 300);
      }

      function showList() {
        $('.fe-news-breadcrumb').html('<a href="/">Home</a> > <span>TIN TỨC</span>');
        fetchMainNews(currentPage);
      }

      function checkRoute() {
        const params = new URLSearchParams(window.location.search);
        const id = params.get('id');
        if (id) {
          showDetail(id);
        } else {
          showList();
        }
      }

      // Intercept clicks on links pointing to ?id=
      $(document).on('click', 'a[href^="?id="]', function(e) {
        e.preventDefault();
        const id = $(this).attr('href').split('=')[1];
        history.pushState(null, '', window.location.pathname + '?id=' + id);
        showDetail(id);
      });

      // Handle Back Button click
      $(document).on('click', '.fe-news-back-btn', function(e) {
        e.preventDefault();
        history.pushState(null, '', window.location.pathname);
        showList();
      });

      // Handle popstate
      window.addEventListener('popstate', function() {
        checkRoute();
      });

      // Khởi động
      fetchSidebarNews();
      checkRoute();
    });
  </script>
</body>

</html>
